[package]
authors = ["ArcticLampyrid <ArcticLampyrid@outlook.com>"]
edition = "2021"
name = "ipp-sharing-gui"
version = "0.1.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
ipp-sharing-core = { path = "../core" }
tokio = { version = "1", features = ["full"] }
eframe = "0.37"
egui_tracing = { git = "https://github.com/daixiwen/egui_tracing", rev = "f9f03ccd5e292c2ada4fae45a7e4e3f2ab7a17a6" }
tracing = { version = "0.1", default-features = false }
humantime = "2.4.0"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
